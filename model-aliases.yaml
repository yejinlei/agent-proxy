# ============================================================
# 模型别名映射文件 - Model Aliases
# 格式: 别名: 目标
#   @default       → 上游 /v1/models 第一个模型（换源自动适配）
#   @db:<id>,<m>   → 指定 DB 记录的模型
#   纯字符串       → 直接用该模型名
# ============================================================

# 示例：添加新模型时取消注释并修改
# my-custom-model:       @default
# gpt-6:                 @default