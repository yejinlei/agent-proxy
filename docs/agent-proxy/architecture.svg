<g id="engine-sec1">
<rect x="425" y="150" width="350" height="120" rx="6" fill="rgba(0,0,0,0.35)" stroke="#00e5ff" stroke-width="1"/>
<text x="600" y="172" text-anchor="middle" font-size="11" fill="#00e5ff">[ ALIAS RESOLVER ]</text>
<line x1="440" y1="180" x2="760" y2="180" stroke="#00e5ff" stroke-width="0.5" opacity="0.3"/>
<text x="445" y="200" font-size="10" fill="rgba(255,255,255,0.85)">  aliases &gt; o1  gpt-5  vmodel  claude-sonnet-5</text>
<text x="445" y="220" font-size="10" fill="rgba(255,255,255,0.85)">  vmodel  &gt;  _default_  &gt;  @default</text>
<text x="445" y="240" font-size="10" fill="rgba(255,255,255,0.85)">  @default  &gt;  gpt-4.1-mini  (real upstream)</text>
<text x="445" y="260" font-size="9" fill="rgba(255,255,255,0.5)">  3-tier: CLI --aliases  &gt;  YAML  &gt;  DefaultAliases(64)</text>
</g>

<g id="engine-sec2">
<rect x="425" y="278" width="350" height="130" rx="6" fill="rgba(0,0,0,0.35)" stroke="#ff55ff" stroke-width="1"/>
<text x="600" y="300" text-anchor="middle" font-size="11" fill="#ff55ff">[ 4x4 TRANSLATION MATRIX ]</text>
<line x1="440" y1="308" x2="760" y2="308" stroke="#ff55ff" stroke-width="0.5" opacity="0.3"/>
<text x="445" y="328" font-size="9" fill="rgba(255,255,255,0.7)">  OA  AN  GM  OR</text>
<text x="445" y="345" font-size="9" fill="#39ff14">  OA  [==][TX][TX][TX]</text>
<text x="445" y="360" font-size="9" fill="rgba(255,255,255,0.7)">  AN  [TX][==][TX][TX]</text>
<text x="445" y="375" font-size="9" fill="rgba(255,255,255,0.7)">  GM  [TX][TX][==][TX]</text>
<text x="445" y="390" font-size="9" fill="rgba(255,255,255,0.7)">  OR  [TX][TX][TX][==]</text>
<text x="620" y="393" font-size="8" fill="rgba(255,255,255,0.5)">== passthrough  TX translate</text>
</g>

<g id="engine-sec3">
<rect x="425" y="416" width="350" height="115" rx="6" fill="rgba(0,0,0,0.35)" stroke="#39ff14" stroke-width="1"/>
<text x="600" y="438" text-anchor="middle" font-size="11" fill="#39ff14">[ BIDIR MODEL SWAP ]</text>
<line x1="440" y1="446" x2="760" y2="446" stroke="#39ff14" stroke-width="0.5" opacity="0.3"/>
<text x="445" y="466" font-size="10" fill="rgba(255,255,255,0.85)">  req :  fake &gt;  real       (client  -&gt;  upstream)</text>
<text x="445" y="486" font-size="10" fill="rgba(255,255,255,0.85)">  resp:  real &gt;  fake       (upstream  -&gt;  client)</text>
<text x="445" y="506" font-size="10" fill="rgba(255,255,255,0.85)">  body.JSON  &amp;&amp;  SSE stream  both directions</text>
<text x="445" y="524" font-size="9" fill="rgba(255,255,255,0.5)">  transparent to both sides - no leak of real provider</text>
</g>

<g id="engine-sec4">
<rect x="425" y="539" width="350" height="108" rx="6" fill="rgba(0,0,0,0.35)" stroke="#ffaa00" stroke-width="1"/>
<text x="600" y="561" text-anchor="middle" font-size="11" fill="#ffaa00">[ LOGGING / DEBUG ]</text>
<line x1="440" y1="569" x2="760" y2="569" stroke="#ffaa00" stroke-width="0.5" opacity="0.3"/>
