<text x="130" y="270" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">Anthropic</text>
<text x="130" y="287" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.7)">Messages</text>
<text x="130" y="307" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.5)">/v1/messages</text>

<rect x="40" y="340" width="180" height="100" rx="6" fill="rgba(0,0,0,0.20)" stroke="#39ff14" stroke-width="1.5" filter="url(#glow)"/>
<text x="130" y="362" text-anchor="middle" font-size="11" fill="#39ff14">[ INBOUND ]</text>
<text x="130" y="385" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">Google</text>
<text x="130" y="402" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.7)">Gemini</text>
<text x="130" y="422" text-anchor="middle" font-size="8" fill="rgba(255,255,255,0.5)">/v1/models/{m}:generate</text>

<rect x="40" y="455" width="180" height="100" rx="6" fill="rgba(0,0,0,0.20)" stroke="#ffaa00" stroke-width="1.5" filter="url(#glow)"/>
