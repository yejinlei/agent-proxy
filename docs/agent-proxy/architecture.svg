<text x="130" y="500" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">OpenAI</text>
<text x="130" y="517" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.7)">Responses</text>
<text x="130" y="537" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.5)">/v1/responses</text>
</g>
<g id="engine-panel">
<rect x="410" y="100" width="380" height="560" rx="10" fill="rgba(0,0,0,0.30)" stroke="rgba(255,255,255,0.15)" stroke-width="2" filter="url(#glow-strong)"/>
<text x="600" y="126" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff" letter-spacing="2">/ agent-proxy / engine /</text>
<line x1="430" y1="135" x2="770" y2="135" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
