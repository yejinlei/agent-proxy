<text x="445" y="609" font-size="10" fill="rgba(255,255,255,0.85)">  -vv    :  full 4-direction body dump</text>
<text x="445" y="629" font-size="9" fill="rgba(255,255,255,0.5)">  inbound-req  |  outbound-req  |  outbound-resp  |  inbound-resp</text>
</g>
