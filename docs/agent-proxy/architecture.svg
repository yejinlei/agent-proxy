<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="1200" height="780" font-family="monospace, monospace">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#0a0a1a"/>
<stop offset="1" stop-color="#1a1a3e"/>
</linearGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
<path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
</pattern>
<filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
<feGaussianBlur stdDeviation="3" result="b"/>
<feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<filter id="glow-strong" x="-40%" y="-40%" width="180%" height="180%">
<feGaussianBlur stdDeviation="6" result="b"/>
<feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<marker id="arr-cy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#00e5ff" filter="url(#glow)"/>
</marker>
<marker id="arr-mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#ff55ff" filter="url(#glow)"/>
</marker>
<marker id="arr-gr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#39ff14" filter="url(#glow)"/>
</marker>
<marker id="arr-am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#ffaa00" filter="url(#glow)"/>
</marker>
</defs><rect x="0" y="0" width="1200" height="780" fill="url(#bg)"/>
<rect x="0" y="0" width="1200" height="780" fill="url(#grid)"/>
<text x="600" y="40" text-anchor="middle" font-size="30" font-weight="bold" fill="#ffffff" filter="url(#glow-strong)">agent-proxy</text>
<text x="600" y="66" text-anchor="middle" font-size="13" fill="rgba(255,255,255,0.6)">$ 4x4 AI Protocol Gateway  ·  Model Alias Mapping  ·  Single Binary</text>
<line x1="180" y1="80" x2="1020" y2="80" stroke="#00e5ff" stroke-width="1" opacity="0.3"/>
<line x1="60" y1="90" x2="1140" y2="90" stroke="#ff55ff" stroke-width="1" opacity="0.15"/>
<g id="left-cards">
<rect x="40" y="110" width="180" height="100" rx="6" fill="rgba(0,0,0,0.20)" stroke="#00e5ff" stroke-width="1.5" filter="url(#glow)"/>
<text x="130" y="132" text-anchor="middle" font-size="11" fill="#00e5ff">[ INBOUND ]</text>
<text x="130" y="155" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">OpenAI</text>
<text x="130" y="172" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.7)">Compatible</text>
<text x="130" y="192" text-anchor="middle" font-size="9" fill="rgba(255,255,255,0.5)">/v1/chat/completions</text>

<rect x="40" y="225" width="180" height="100" rx="6" fill="rgba(0,0,0,0.20)" stroke="#ff55ff" stroke-width="1.5" filter="url(#glow)"/>
